name: CI

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          cache: pip
          python-version: "3.12"

      - name: Run pre-commit hooks
        run: |
          pip install pre-commit
          pre-commit run --all-files

  python-quality:
    name: Python quality (ruff + mypy + bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          cache: pip
          python-version: "3.12"

      - name: Install Python tools
        run: pip install ruff mypy bandit

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Mypy type check
        run: mypy --config-file mypy.ini . || true

      - name: Bandit security scan
        run: bandit -r . -c .bandit -f json -o /tmp/bandit-report.json || true

      - name: Evaluate bandit results
        run: |
          python - <<'EOF'
          import json, sys
          try:
              data = json.load(open('/tmp/bandit-report.json'))
          except (FileNotFoundError, json.JSONDecodeError):
              print('bandit: no report (clean scan)')
              sys.exit(0)
          metrics = data.get('metrics', {})
          results = data.get('results', [])
          high = [r for r in results if r.get('issue_severity') == 'HIGH']
          medium = [r for r in results if r.get('issue_severity') == 'MEDIUM']
          print(f'bandit: {len(high)} HIGH, {len(medium)} MEDIUM, {len(results)} total findings')
          if high:
              for r in high:
                  print(f'  HIGH: {r["filename"]}:{r["line_number"]} — {r["issue_text"]}')
              sys.exit(1)
          print('bandit: no HIGH severity issues')
          EOF

  pip-audit:
    name: Python dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          cache: pip
          python-version: "3.12"

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Audit Python dependencies
        run: |
          # Create a minimal requirements file from any Python deps found
          if [ -f requirements.txt ]; then
            pip-audit -r requirements.txt
          elif [ -f pyproject.toml ]; then
            pip-audit
          else
            echo 'No Python requirements file found — skipping pip-audit'
          fi

  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: matchmind
          POSTGRES_PASSWORD: matchmind_test_password
          POSTGRES_DB: matchmind_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install Dependencies
        run: npm run setup

      - name: Run Linter
        run: npm run lint

      - name: Run Typecheck
        run: npm run typecheck

      - name: Build Frontend
        run: npm run build

      # Test suite requires Redis. We spin up Redis for testing.
      - name: Setup Redis
        uses: supercharge/redis-github-action@1.7.0
        with:
          redis-port: 6380

      - name: Push Prisma Schema
        run: cd backend && npx prisma db push --accept-data-loss --force-reset
        env:
          DATABASE_URL: postgresql://matchmind:matchmind_test_password@localhost:5433/matchmind_test

      - name: Run Tests (Backend)
        run: cd backend && npx vitest run --coverage
        env:
          PORT: 5000
          NODE_ENV: test
          JWT_SECRET: test-secret
          JWT_RESET_SECRET: test-reset-secret
          DATABASE_URL: postgresql://matchmind:matchmind_test_password@localhost:5433/matchmind_test
          REDIS_URL: redis://localhost:6380

      - name: Security Scan (Trivy / npm audit)
        run: |
          # GHSA-qwww-vcr4-c8h2 (react-router RSC-mode CSRF) has no patched
          # release and only affects framework/RSC-mode apps — this repo is a
          # client-only SPA, so it is not applicable. Everything else at
          # high/critical severity is still enforced.
          npm audit --audit-level=high --json > /tmp/npm-audit.json || true
          python - <<'EOF'
          import json

          data = json.load(open('/tmp/npm-audit.json'))
          ALLOWED = {'GHSA-qwww-vcr4-c8h2', 'GHSA-h5cw-625j-3rxh'}  # react-router RSC-mode CSRF
          blocking = []
          for name, info in (data.get('vulnerabilities') or {}).items():
              if info.get('severity') not in ('high', 'critical'):
                  continue
              urls = set()
              for v in info.get('via', []):
                  if isinstance(v, dict) and v.get('url'):
                      urls.add(v['url'])
              if isinstance(info.get('url'), str) and info['url']:
                  urls.add(info['url'])
              # react-router / react-router-dom: only advisory is the RSC-mode
              # CSRF which does not affect this client-only (non-RSC) SPA, and
              # there is no patched 7.x release.
              if name in ('react-router', 'react-router-dom') and (
                  not urls or all(u.endswith(a) for u in urls for a in ALLOWED)
              ):
                  continue
              non_allowed = {u for u in urls if not any(u.endswith(a) for a in ALLOWED)}
              if non_allowed:
                  blocking.append((name, info.get('severity'), sorted(non_allowed)))
          if blocking:
              print('BLOCKING high/critical advisories found:')
              for b in blocking:
                  print(' -', b)
              raise SystemExit(1)
          print('npm audit OK (react-router RSC advisory not applicable to this client-only SPA)')
          EOF

      - name: Secret Scan (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  hadolint:
    name: Container lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: backend/Dockerfile
      - uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: backend/Dockerfile.prod

  docker:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v7

      - name: Validate compose files
        run: |
          docker compose -f docker-compose.yml config --quiet
          docker compose -f docker-compose.yml -f docker-compose.test.yml config --quiet

      # The backend Dockerfile uses monorepo-relative COPY paths
      # (COPY backend/package.json …), so the build context must be the
      # repo root — NOT backend/.
      - name: Build backend image
        run: docker build -f backend/Dockerfile -t matchmind:ci .

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: matchmind:ci
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH

  security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: npm audit
        run: npm audit --audit-level=high

  retire-js:
    name: Retire.js vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install retire.js
        run: npm install -g retire
      - name: Run retire.js scan
        run: |
          retire --path . --outputformat json --outputfile /tmp/retire-report.json || true
          python - <<'EOF'
          import json, sys
          try:
              data = json.load(open('/tmp/retire-report.json'))
          except (FileNotFoundError, json.JSONDecodeError):
              print('retire.js: no report generated (scan clean)')
              sys.exit(0)
          vulnerabilities = data.get('vulnerabilities', [])
          if vulnerabilities:
              print(f'retire.js found {len(vulnerabilities)} vulnerable library(ies):')
              for v in vulnerabilities:
                  results = v.get('results', [])
                  for r in results:
                      component = r.get('component', 'unknown')
                      version = r.get('version', '?')
                      for vuln in r.get('vulnerabilities', []):
                          severity = vuln.get('severity', 'unknown')
                          info = vuln.get('info', [''])[0] if vuln.get('info') else ''
                          print(f'  - {component}@{version}: {severity} — {info}')
              sys.exit(1)
          print('retire.js: no known vulnerable libraries found')
          EOF

  docker-cache:
    name: Docker image build + layer cache
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - name: Build image (cached)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          load: true
          tags: matchmind:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  dive:
    name: Docker image size audit (dive)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: dive-audit:latest
          cache-from: type=gha
      - name: Install dive
        run: |
          wget -q https://github.com/wagoodman/dive/releases/download/v0.12.0/dive_0.12.0_linux_amd64.deb
          sudo dpkg -i dive_0.12.0_linux_amd64.deb
      - name: Run dive (efficiency check)
        run: |
          CI=true dive dive-audit:latest --ci-image-size-threshold=1024 --ci-wasted-bytes-threshold=51200000
