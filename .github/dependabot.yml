version: 2
updates:
- package-ecosystem: npm
  directory: /backend
  schedule:
    interval: weekly
    day: monday
    time: 09:00
    timezone: Asia/Kolkata
  open-pull-requests-limit: 10
  labels:
  - dependencies
  - backend
  commit-message:
    prefix: deps(backend)
    include: scope
  ignore:
  - dependency-name: '@types/*'
    update-types:
    - version-update:semver-patch
- package-ecosystem: npm
  directory: /frontend
  schedule:
    interval: weekly
    day: monday
    time: 09:00
    timezone: Asia/Kolkata
  open-pull-requests-limit: 10
  labels:
  - dependencies
  - frontend
  commit-message:
    prefix: deps(frontend)
    include: scope
  ignore:
  - dependency-name: '@types/*'
    update-types:
    - version-update:semver-patch
- package-ecosystem: pre-commit
  directory: /
  schedule:
    interval: weekly
    day: monday
    time: 09:00
    timezone: Asia/Kolkata
  labels:
  - dependencies
  - pre-commit
  commit-message:
    prefix: chore(deps)
    include: scope
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: weekly
    day: monday
    time: 09:00
    timezone: Asia/Kolkata
  labels:
  - dependencies
  - github-actions
  commit-message:
    prefix: chore(deps)
    include: scope
- package-ecosystem: docker
  directory: /backend
  schedule:
    interval: weekly
    day: monday
    time: 09:00
    timezone: Asia/Kolkata
  labels:
  - dependencies
  - docker
  commit-message:
    prefix: chore(deps)
    include: scope
