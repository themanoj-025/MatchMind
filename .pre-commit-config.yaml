repos:
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
        types_or: [javascript, jsx, ts, tsx, json, css, scss, markdown]
        additional_dependencies: ['prettier@3.9.8']

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        # generated Prisma ERD baseline: raw output has trailing whitespace on
        # blank lines; prisma generate rewrites it on every typecheck
        exclude: '^backend/docs/schema-baseline\.md$'
      - id: end-of-file-fixer
      - id: check-yaml
        # k8s/deployment.yaml is a multi-document manifest
        args: ['--multi']
      - id: check-json
        # tsconfig files are JSONC (comments allowed) — exclude them
        exclude: 'tsconfig.*\.json$'
      - id: check-added-large-files
        args: ['--maxkb=1000']
