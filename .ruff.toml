# Ruff configuration for Match-Mind
# Primarily for any Python utility scripts; the main codebase is TypeScript.

target-version = "py312"
line-length = 120

[lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "S",    # flake8-bandit (security)
    "UP",   # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

[lint.per-file-ignores]
"tests/**/*.py" = ["S101"]  # assert allowed in tests

[format]
quote-style = "double"
indent-style = "space"
